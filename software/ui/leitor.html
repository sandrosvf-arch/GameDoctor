<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<title>Leitor — Game Doctor</title>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="vendor/pdfjs/pdf.min.js"></script>
<style>
:root{--bg:#0e1116;--panel:#161b22;--bord:#262d38;--tx:#e6edf3;--dim:#8b949e;--ac:#1fb6ff;--hl:#f1c40f;--hl2:#ff9800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:13px 'Segoe UI',sans-serif;display:flex;flex-direction:column;user-select:none}
#tools{display:flex;gap:6px;align-items:center;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--bord);flex-wrap:wrap}
#ttl{font-weight:600;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:8px}
#busca{background:#0d1117;border:1px solid var(--bord);color:var(--tx);border-radius:6px;padding:5px 10px;width:210px;font-size:12.5px;outline:none}
#busca:focus{border-color:var(--ac)}
.btn{background:#21262d;border:1px solid var(--bord);color:var(--tx);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;user-select:none}
.btn:hover{border-color:var(--ac)}
#cnt{color:var(--hl);font-size:12px;font-weight:600;min-width:110px}
.chk{color:var(--dim);font-size:11.5px;display:flex;align-items:center;gap:4px;cursor:pointer}
#pgbar{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:12px;margin-left:auto}
#pgnum{width:44px;text-align:center;background:#0d1117;border:1px solid var(--bord);color:var(--tx);border-radius:5px;padding:3px}
#viewer{flex:1;overflow:auto;text-align:center;background:#1a1f27;position:relative}
#pagewrap{position:relative;display:inline-block;margin:14px auto}
#pagecv{display:block;background:#fff;box-shadow:0 3px 18px #0009}
#txtlayer{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;line-height:1}
#txtlayer span{position:absolute;color:transparent;white-space:pre;cursor:pointer;transform-origin:0 0}
#txtlayer span:hover{outline:1.5px dashed var(--ac);outline-offset:1px}
#txtlayer span.hit{background:rgba(241,196,15,.42);border-radius:2px}
#txtlayer span.hitcur{background:rgba(255,152,0,.62);outline:1.5px solid var(--hl2)}
#status{padding:5px 12px;font-size:11.5px;color:var(--dim);background:#10151c;border-top:1px solid var(--bord);display:flex;gap:16px}
#status b{color:#3fb950}
#status .marca{margin-left:auto;color:#57606a}
#load{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);color:var(--dim);font-size:14px}
/* imagem */
#imgwrap{position:absolute;inset:0;overflow:hidden;cursor:grab;display:none;background:#1a1f27}
#imgwrap.on{display:block}
#imgwrap img{position:absolute;left:0;top:0;transform-origin:0 0;image-rendering:auto;pointer-events:none}
</style></head><body>
<div id="tools">
  <span id="ttl"></span>
  <span id="pdf-tools" style="display:none;gap:6px;align-items:center;flex:1">
    <input id="busca" placeholder="🔍 Buscar no documento (F3)" spellcheck="false">
    <button class="btn" onclick="CP.nav(-1)">◀</button>
    <button class="btn" onclick="CP.nav(1)">▶</button>
    <span id="cnt">—</span>
    <label class="chk"><input type="checkbox" id="ww" checked> Palavra inteira</label>
    <span id="pgbar">
      <button class="btn" onclick="CP.zoom(-1)">−</button>
      <span id="zoomlbl">100%</span>
      <button class="btn" onclick="CP.zoom(1)">+</button>
      <button class="btn" onclick="CP._zoomManual=false;CP.ajustar()" title="Página inteira na tela">⤢ Ajustar</button>
      · pág <input id="pgnum" value="1"> / <span id="pgtot">?</span>
      <button class="btn" onclick="CP.pagina(CP.pg-1)">‹</button>
      <button class="btn" onclick="CP.pagina(CP.pg+1)">›</button>
    </span>
  </span>
  <span id="img-tools" style="display:none;gap:6px;align-items:center;margin-left:auto">
    <button class="btn" onclick="IM.zoom(-1)">−</button>
    <span id="izoom">100%</span>
    <button class="btn" onclick="IM.zoom(1)">+</button>
    <button class="btn" onclick="IM.ajustar()">⤢ Ajustar</button>
  </span>
</div>
<div id="viewer">
  <div id="load">Carregando…</div>
  <div id="pagewrap" style="display:none">
    <canvas id="pagecv"></canvas>
    <div id="txtlayer"></div>
  </div>
  <div id="imgwrap"><img id="img" draggable="false"></div>
</div>
<div id="status"><span id="st-txt">Uso pessoal do assinante — não redistribuir.</span><span class="marca" id="st-marca"></span></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdfjs/pdf.worker.min.js';
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('keydown', function (e) {
  /* sem salvar / imprimir */
  if (e.ctrlKey && ['s', 'p', 'S', 'P'].indexOf(e.key) >= 0) e.preventDefault();
});
function $(id){ return document.getElementById(id); }
function statusMsg(t){ $('st-txt').innerHTML = t; }

var CP = { bridge: null, pdf: null, pg: 1, tot: 0, escala: 1.0, paginas: [], hits: [], hi: -1, termo: '', _renderTask: null, cross: false };
var IM = { s: 1, x: 0, y: 0, w: 0, h: 0 };

new QWebChannel(qt.webChannelTransport, function (ch) {
  CP.bridge = ch.objects.leitorBridge;
  CP.bridge.carregar(function (js) {
    var d = JSON.parse(js || '{}');
    if (!d.ok) { $('load').textContent = 'Falha ao abrir: ' + (d.erro || '?'); return; }
    $('ttl').textContent = d.nome || '';
    $('st-marca').textContent = d.marca || '';
    CP.cross = !!d.cross;
    var bin = atob(d.b64), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    if (d.tipo === 'pdf') abrirPdf(u8);
    else abrirImagem(u8, d.mime);
  });
});

/* ══════════════ PDF ══════════════ */
function abrirPdf(u8) {
  $('pdf-tools').style.display = 'flex';
  pdfjsLib.getDocument({ data: u8 }).promise.then(function (pdf) {
    CP.pdf = pdf; CP.tot = pdf.numPages;
    $('pgtot').textContent = pdf.numPages;
    $('load').style.display = 'none';
    $('pagewrap').style.display = 'inline-block';
    CP.ajustar(1);          /* abre com a pagina inteira visivel */
    CP.indexar();
    if (CP.cross) statusMsg('🔗 Cross-probe <b>ATIVO</b> — clique num nome no esquema para selecionar no Boardview');
  }, function (e) { $('load').textContent = 'Falha ao abrir PDF: ' + e.message; });
}
CP.indexar = function () {
  var p = 1;
  function prox() {
    if (p > CP.tot) return;
    CP.pdf.getPage(p).then(function (page) { return page.getTextContent(); }).then(function (tc) {
      CP.paginas[p - 1] = CP.paginas[p - 1] || {};
      CP.paginas[p - 1].items = tc.items;
      p++; prox();
    });
  }
  prox();
};
var _medCtx = document.createElement('canvas').getContext('2d');
function montarTextLayer(tc, vp) {
  var tl = $('txtlayer');
  tl.innerHTML = '';
  tl.style.width = vp.width + 'px'; tl.style.height = vp.height + 'px';
  var frag = document.createDocumentFragment();
  for (var i = 0; i < tc.items.length; i++) {
    var it = tc.items[i];
    if (!it.str || !it.str.trim()) continue;
    var tx = pdfjsLib.Util.transform(vp.transform, it.transform);
    var fh = Math.hypot(tx[2], tx[3]);
    if (fh <= 0) continue;
    var ang = Math.atan2(tx[1], tx[0]);
    var asc = fh * 0.8;
    var left = ang ? tx[4] + asc * Math.sin(ang) : tx[4];
    var top  = ang ? tx[5] - asc * Math.cos(ang) : tx[5] - asc;
    var s = document.createElement('span');
    s.textContent = it.str;
    s.style.left = left + 'px'; s.style.top = top + 'px';
    s.style.fontSize = fh + 'px'; s.style.fontFamily = 'sans-serif';
    _medCtx.font = fh + 'px sans-serif';
    var med = _medCtx.measureText(it.str).width, alvo = it.width * vp.scale, t = '';
    if (ang) t += 'rotate(' + (ang * 180 / Math.PI) + 'deg) ';
    if (med > 0 && alvo > 0) t += 'scaleX(' + (alvo / med) + ')';
    if (t) s.style.transform = t;
    frag.appendChild(s);
  }
  tl.appendChild(frag);
}
CP.pagina = function (n, cb) {
  if (!CP.pdf) return;
  n = Math.max(1, Math.min(CP.tot, n | 0));
  CP.pg = n; $('pgnum').value = n;
  CP.pdf.getPage(n).then(function (page) {
    var dpr = window.devicePixelRatio || 1;
    var vp  = page.getViewport({ scale: CP.escala * 1.5 });
    var vpc = page.getViewport({ scale: CP.escala * 1.5 * dpr });
    var cv = $('pagecv'), ctx = cv.getContext('2d');
    cv.width = vpc.width; cv.height = vpc.height;
    cv.style.width = vp.width + 'px'; cv.style.height = vp.height + 'px';
    $('pagewrap').style.width = vp.width + 'px'; $('pagewrap').style.height = vp.height + 'px';
    if (CP._renderTask) { try { CP._renderTask.cancel(); } catch (e) {} }
    CP._renderTask = page.render({ canvasContext: ctx, viewport: vpc });
    CP._renderTask.promise.then(function () { return page.getTextContent(); }).then(function (tc) {
      CP.paginas[n - 1] = CP.paginas[n - 1] || {};
      CP.paginas[n - 1].items = tc.items;
      montarTextLayer(tc, vp);
      CP.marcarHitsDaPagina();
      if (cb) cb();
    });
  });
};
CP.zoom = function (d) {
  CP._zoomManual = true;
  CP.escala = Math.max(0.1, Math.min(4, CP.escala + d * 0.2));
  $('zoomlbl').textContent = Math.round(CP.escala * 100) + '%';
  CP.pagina(CP.pg);
};
/* escala que faz a pagina inteira caber na area de leitura (mapas/fotos de placa sao enormes) */
CP.ajustar = function (n) {
  if (!CP.pdf) return;
  CP.pdf.getPage(n || CP.pg).then(function (page) {
    var vp = page.getViewport({ scale: 1.5 });
    var v = $('viewer'), w = v.clientWidth - 24, h = v.clientHeight - 24;
    var esc = Math.min(w / vp.width, h / vp.height);
    CP.escala = Math.max(0.1, Math.min(4, Math.floor(esc * 100) / 100));
    $('zoomlbl').textContent = Math.round(CP.escala * 100) + '%';
    CP.pagina(n || CP.pg);
  });
};
window.addEventListener('resize', function () { if (CP.pdf && !CP._zoomManual) CP.ajustar(); });
$('pgnum').addEventListener('keydown', function (e) { if (e.key === 'Enter') CP.pagina(parseInt(this.value, 10) || 1); });
function regexTermo(t, ww) {
  var esc = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp(ww ? '(?<![A-Za-z0-9_])' + esc + '(?![A-Za-z0-9_])' : esc, 'i');
}
CP.buscar = function (termo, ww) {
  termo = (termo || '').trim();
  if (!termo || !CP.pdf) return;
  CP.termo = termo; $('busca').value = termo;
  CP._ww = (ww === undefined) ? $('ww').checked : ww;
  var re = regexTermo(termo, CP._ww);
  CP.hits = [];
  for (var p = 0; p < CP.tot; p++) {
    var pg = CP.paginas[p];
    if (!pg || !pg.items) continue;
    for (var i = 0; i < pg.items.length; i++) if (re.test(pg.items[i].str)) CP.hits.push({ pg: p + 1, item: i });
  }
  if (!CP.hits.length) { $('cnt').textContent = 'nada encontrado'; return; }
  var pgs = {}; CP.hits.forEach(function (h) { pgs[h.pg] = 1; });
  CP._pgsHit = Object.keys(pgs).join(', ');
  CP.hi = -1; CP.nav(1);
};
CP.nav = function (d) {
  if (!CP.hits.length) return;
  CP.hi = (CP.hi + d + CP.hits.length) % CP.hits.length;
  var h = CP.hits[CP.hi];
  $('cnt').textContent = (CP.hi + 1) + '/' + CP.hits.length + ' · págs ' + CP._pgsHit;
  if (h.pg !== CP.pg) CP.pagina(h.pg, function () { CP.scrollAoHit(); });
  else { CP.marcarHitsDaPagina(); CP.scrollAoHit(); }
};
CP.marcarHitsDaPagina = function () {
  var spans = $('txtlayer').querySelectorAll('span');
  CP._curSpan = null;
  for (var i = 0; i < spans.length; i++) spans[i].classList.remove('hit', 'hitcur');
  if (!CP.termo || !CP.hits.length) return;
  var re = regexTermo(CP.termo, CP._ww), alvoLocal = -1, atual = CP.hits[CP.hi];
  if (atual && atual.pg === CP.pg) { alvoLocal = 0; for (var k = 0; k < CP.hi; k++) if (CP.hits[k].pg === CP.pg) alvoLocal++; }
  var enc = 0;
  for (i = 0; i < spans.length; i++) {
    var s = spans[i];
    if (!s.textContent || !re.test(s.textContent)) continue;
    if (enc === alvoLocal) { s.classList.add('hitcur'); CP._curSpan = s; } else s.classList.add('hit');
    enc++;
  }
};
CP.scrollAoHit = function () { if (CP._curSpan) CP._curSpan.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' }); };
CP.buscarExterno = function (nome) { CP.buscar(nome, true); };
$('txtlayer').addEventListener('click', function (e) {
  var alvo = e.target;
  if (!alvo || alvo.tagName !== 'SPAN') return;
  var palavra = (palavraNoClique(alvo, e) || alvo.textContent || '').trim();
  if (!palavra || palavra.length < 2) return;
  if (CP.cross && CP.bridge) { CP.bridge.schProbeBoard(palavra); statusMsg('🔗 Enviado ao Boardview: <b>' + palavra + '</b>'); }
  CP.buscar(palavra, true);
});
function palavraNoClique(span, ev) {
  try {
    var rng = document.caretRangeFromPoint(ev.clientX, ev.clientY);
    if (!rng || rng.startContainer.nodeType !== 3) return null;
    var txt = rng.startContainer.textContent, off = rng.startOffset, ok = /[A-Za-z0-9_+\-./#]/, a = off, b = off;
    while (a > 0 && ok.test(txt[a - 1])) a--;
    while (b < txt.length && ok.test(txt[b])) b++;
    return txt.slice(a, b);
  } catch (e) { return null; }
}
$('busca').addEventListener('keydown', function (e) { if (e.key === 'Enter') CP.buscar(this.value); });
$('ww').addEventListener('change', function () { if (CP.termo) CP.buscar(CP.termo); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'F3' || (e.ctrlKey && e.key.toLowerCase() === 'f')) { e.preventDefault(); $('busca').focus(); $('busca').select(); }
});

/* ══════════════ IMAGEM ══════════════ */
function abrirImagem(u8, mime) {
  $('img-tools').style.display = 'flex';
  var blob = new Blob([u8], { type: mime || 'image/png' });
  var url = URL.createObjectURL(blob);
  var img = $('img');
  img.onload = function () {
    IM.w = img.naturalWidth; IM.h = img.naturalHeight;
    $('load').style.display = 'none';
    $('imgwrap').classList.add('on');
    IM.ajustar();
  };
  img.src = url;
}
IM.aplicar = function () {
  $('img').style.transform = 'translate(' + IM.x + 'px,' + IM.y + 'px) scale(' + IM.s + ')';
  $('izoom').textContent = Math.round(IM.s * 100) + '%';
};
IM.ajustar = function () {
  var w = $('imgwrap'), W = w.clientWidth, H = w.clientHeight;
  IM.s = Math.min(W / IM.w, H / IM.h, 1);
  IM.x = (W - IM.w * IM.s) / 2; IM.y = (H - IM.h * IM.s) / 2;
  IM.aplicar();
};
IM.zoom = function (d, cx, cy) {
  var w = $('imgwrap');
  if (cx === undefined) { cx = w.clientWidth / 2; cy = w.clientHeight / 2; }
  var ns = Math.max(0.05, Math.min(12, IM.s * (d > 0 ? 1.2 : 1 / 1.2)));
  IM.x = cx - (cx - IM.x) * ns / IM.s; IM.y = cy - (cy - IM.y) * ns / IM.s;
  IM.s = ns; IM.aplicar();
};
(function () {
  var w = $('imgwrap'), drag = null;
  w.addEventListener('wheel', function (e) { e.preventDefault(); IM.zoom(e.deltaY < 0 ? 1 : -1, e.offsetX, e.offsetY); }, { passive: false });
  w.addEventListener('mousedown', function (e) { drag = { x: e.clientX - IM.x, y: e.clientY - IM.y }; w.style.cursor = 'grabbing'; });
  window.addEventListener('mousemove', function (e) { if (drag) { IM.x = e.clientX - drag.x; IM.y = e.clientY - drag.y; IM.aplicar(); } });
  window.addEventListener('mouseup', function () { drag = null; w.style.cursor = 'grab'; });
  window.addEventListener('resize', function () { if ($('imgwrap').classList.contains('on')) IM.ajustar(); });
})();
</script>
</body></html>
